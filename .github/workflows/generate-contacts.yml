name: Generate Contacts Markdown

on:
  push:
    paths:
      - "assets/contact.yml"
      - ".github/workflows/generate-contacts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Generate Markdown
        run: node assets/js/generate-md.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contacts.md from contacts.yml"
